<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widow Pension — Demo Form</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --primary: #047857;
      --primary-hover: #065f46;
      --alert-bg: #fef3c7;
      --alert-border: #f59e0b;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #065f46;
    }
    .disclaimer {
      background: var(--alert-bg);
      border-left: 4px solid var(--alert-border);
      padding: 12px;
      margin-bottom: 24px;
      border-radius: 4px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 16px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      min-height: 48px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.2);
    }
    button[type="submit"] {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
    }
    button[type="submit"]:hover {
      background-color: var(--primary-hover);
    }
    .result-box {
      display: none;
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .result-box h2 {
      margin-top: 0;
      color: #065f46;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Widow Pension — Demo Form</h1>
    <div class="disclaimer">
      <strong>Notice:</strong> This is a local prototype simulation for Hakdaar. No data is stored, transmitted, or submitted to any government portal.
    </div>

    <form id="demo-form">
      <div class="form-group">
        <label for="applicant_name">Applicant's full name</label>
        <input type="text" id="applicant_name" name="applicant_name" placeholder="e.g. Radha Devi" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="spouse_name">Spouse's full name</label>
        <input type="text" id="spouse_name" name="spouse_name" placeholder="e.g. Late Mohan Lal" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="date_of_death">Date of death</label>
        <input type="text" id="date_of_death" name="date_of_death" placeholder="DD-MM-YYYY" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="district">District</label>
        <input type="text" id="district" name="district" placeholder="e.g. Varanasi" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="address">Current address</label>
        <input type="text" id="address" name="address" placeholder="e.g. Village Shivpur, Varanasi" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">Submit Widow Pension Application (Demo)</button>
    </form>

    <div id="result-message" class="result-box">
      <h2>Simulation Complete</h2>
      <p id="status-text">Demo complete — this was a local simulation. No government application was submitted and no data was saved.</p>
    </div>
  </div>

  <script>
    document.getElementById('demo-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('demo-form').style.display = 'none';
      document.getElementById('result-message').style.display = 'block';
    });
  </script>
</body>
</html>
